<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas Complexa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Minhas Tarefas</h1>
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Adicionar nova tarefa...">
            <select id="priorityInput">
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
            </select>
            <button onclick="addTask()">Adicionar</button>
        </div>
        
        <div class="filters">
            <button onclick="filterTasks('all')">Todas</button>
            <button onclick="filterTasks('pending')">Pendentes</button>
            <button onclick="filterTasks('completed')">Concluídas</button>
        </div>

        <ul id="taskList">
            <!-- As tarefas serão inseridas aqui dinamicamente -->
        </ul>
    </div>
    <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
        <span id="progressText">0% concluído</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
